name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production-landing
      url: https://workforce0-landing.pages.dev
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Strip non-marketing routes (hosted = landing only)
        working-directory: frontend/src/app
        run: |
          rm -rf "(dashboard)" "(onboarding)" login signup forgot-password reset-password

      - name: Build static landing (HOSTED_MODE)
        working-directory: frontend
        env:
          NEXT_PUBLIC_HOSTED_MODE: "1"
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/out --project-name=workforce0-landing --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
