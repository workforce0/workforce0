# Dependabot — weekly dependency updates across the workspaces.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Root workspace (if any tooling here)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["deps", "dependabot"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["deps", "backend"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["deps", "frontend"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/agent"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["deps", "agent"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["deps", "docs-site"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions themselves
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["deps", "ci"]
