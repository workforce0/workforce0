# =============================================================================
# WORKFORCE0 - PRODUCTION DOCKER COMPOSE
# =============================================================================
#
# Full-stack deployment: PostgreSQL, Redis, Backend API, Frontend
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down
#
# Requires .env file in project root with all production secrets.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: workforce0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-workforce0}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: workforce0-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Backend API (Fastify)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workforce0-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workforce0}
      REDIS_URL: redis://redis:6379
      # Local storage lives under /app/data/uploads inside the container.
      # The volume below persists uploads across container restarts.
      STORAGE_ROOT: /app/data/uploads
      # Voice intake (local-voice profile). Bridge URL points at the
      # pipecat-bridge sidecar; BRIDGE_JWT_SECRET is shared with the bridge
      # for short-lived call tokens. Both default-empty when local-voice is
      # not active so the backend continues to start.
      PIPECAT_BRIDGE_URL: ${PIPECAT_BRIDGE_URL:-http://pipecat-bridge:8400}
      BRIDGE_JWT_SECRET: ${BRIDGE_JWT_SECRET:-}
    volumes:
      # Meeting audio/video uploads for the local storage driver. Not used
      # when STORAGE_DRIVER=s3 — safe to keep mounted either way.
      - backend_uploads:/app/data/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 explicitly: alpine wget resolves "localhost" to ::1
      # (IPv6) but the server binds IPv4 0.0.0.0, so localhost gets connection
      # refused and the container is permanently marked unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:3000
    container_name: workforce0-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Ollama (local LLM, opt-in via COMPOSE_PROFILES=local-llm)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.21.2
    container_name: workforce0-ollama
    restart: unless-stopped
    # Belongs to BOTH `local-llm` (standalone Council fallback) AND
    # `local-voice` (the Pipecat sidecar's LLM). Listing both lets
    # `--profile local-voice` start ollama automatically without forcing the
    # operator to also pass `--profile local-llm`. Same convenience applies
    # to whisper and kokoro-tts below.
    profiles: ["local-llm", "local-voice"]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama_cache:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Whisper STT (faster-whisper-server, opt-in via COMPOSE_PROFILES=local-stt)
  # ---------------------------------------------------------------------------
  # Pinned to 0.5.0-cpu (last stable semver tag on Docker Hub as of 2026-04;
  # newer tags are 0.6.0-rc.* release candidates). Upstream project was renamed
  # to `speaches-ai/speaches`; the `fedirz/faster-whisper-server` image is the
  # frozen pre-rename build. Tag list:
  # https://hub.docker.com/r/fedirz/faster-whisper-server/tags
  #
  # Env vars use Pydantic's `env_nested_delimiter="__"` (double underscore)
  # for nested settings on the WhisperConfig model. Single underscores are
  # silently ignored. Source:
  # https://github.com/fedirz/faster-whisper-server/blob/v0.5.0/src/faster_whisper_server/config.py
  # ---------------------------------------------------------------------------
  # Kokoro TTS (local-voice profile, opt-in via COMPOSE_PROFILES=local-voice)
  # ---------------------------------------------------------------------------
  # TODO(image-verify): The `ghcr.io/remsky/kokoro-fastapi:latest` tag is the
  # canonical published image per the Kokoro-FastAPI README, but anonymous
  # GHCR manifest fetch returns 401 so the tag could not be confirmed at
  # compose-write time. If pull fails at deploy, fall back to a Docker Hub
  # search ("remsky/kokoro-fastapi") or build locally from the upstream repo
  # (https://github.com/remsky/Kokoro-FastAPI) and replace this `image:` line
  # with a `build:` block.
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi:latest
    container_name: workforce0-kokoro-tts
    restart: unless-stopped
    profiles: ["local-voice"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8880/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Pipecat bridge (local-voice profile)
  # ---------------------------------------------------------------------------
  # Python sidecar that wires Whisper STT → Ollama LLM → Kokoro TTS into a
  # Pipecat pipeline. Backend mints short-lived JWTs for the WebSocket
  # call-bridge using BRIDGE_JWT_SECRET (must match the bridge's value).
  # When local-voice is active, BRIDGE_JWT_SECRET is required.
  pipecat-bridge:
    build:
      context: ./infra/pipecat-bridge
      dockerfile: Dockerfile
    container_name: workforce0-pipecat-bridge
    restart: unless-stopped
    profiles: ["local-voice"]
    environment:
      WHISPER_BASE_URL: http://whisper:8000
      OLLAMA_BASE_URL: http://ollama:11434
      KOKORO_BASE_URL: http://kokoro-tts:8880
      BRIDGE_JWT_SECRET: ${BRIDGE_JWT_SECRET:?BRIDGE_JWT_SECRET is required when local-voice is active}
    depends_on:
      whisper:
        condition: service_healthy
      ollama:
        condition: service_healthy
      kokoro-tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8400/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - workforce0

  whisper:
    image: fedirz/faster-whisper-server:0.5.0-cpu
    container_name: workforce0-whisper
    restart: unless-stopped
    # Member of BOTH `local-stt` (standalone STT fallback) AND `local-voice`
    # (used as the Pipecat sidecar's STT). See the ollama service for
    # rationale — single-profile deploys still get a working voice stack
    # without having to know about transitive dependencies.
    profiles: ["local-stt", "local-voice"]
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-large-v3-turbo}
      WHISPER__INFERENCE_DEVICE: ${WHISPER_INFERENCE_DEVICE:-auto}
      WHISPER__COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      PRELOAD_MODELS: '["${WHISPER_MODEL:-Systran/faster-whisper-large-v3-turbo}"]'
    volumes:
      - whisper_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - workforce0

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  ollama_cache:
    driver: local
  whisper_cache:
    driver: local

networks:
  workforce0:
    driver: bridge
