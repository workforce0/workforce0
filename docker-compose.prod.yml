# =============================================================================
# WORKFORCE0 - PRODUCTION DOCKER COMPOSE
# =============================================================================
#
# Full-stack deployment: PostgreSQL, Redis, Backend API, Frontend
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down
#
# Requires .env file in project root with all production secrets.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: workforce0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-workforce0}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: workforce0-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Backend API (Fastify)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workforce0-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workforce0}
      REDIS_URL: redis://redis:6379
      # Local storage lives under /app/data/uploads inside the container.
      # The volume below persists uploads across container restarts.
      STORAGE_ROOT: /app/data/uploads
      # Plan 2: defaults point at the internal `ollama` and `whisper`
      # services (started via COMPOSE_PROFILES=local-llm / local-stt).
      # When those profiles aren't enabled, the containers don't run,
      # OllamaService.isAvailable()/LocalWhisperProvider.isAvailable()
      # return false, and the AI Council / STT router falls through to
      # the next provider in the chain. Safe to leave set unconditionally.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://whisper:8000}
    volumes:
      # Meeting audio/video uploads for the local storage driver. Not used
      # when STORAGE_DRIVER=s3 — safe to keep mounted either way.
      - backend_uploads:/app/data/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 explicitly: alpine wget resolves "localhost" to ::1
      # (IPv6) but the server binds IPv4 0.0.0.0, so localhost gets connection
      # refused and the container is permanently marked unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:3000
    container_name: workforce0-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Vexa meeting bot (opt-in via COMPOSE_PROFILES=meeting-bot)
  # ---------------------------------------------------------------------------
  vexa-api:
    image: ghcr.io/vexa-project/vexa-api:0.6
    container_name: workforce0-vexa-api
    restart: unless-stopped
    profiles: ["meeting-bot"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/workforce0_vexa
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18056/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - workforce0

  vexa-bot-manager:
    image: ghcr.io/vexa-project/vexa-bot-manager:0.6
    container_name: workforce0-vexa-bot-manager
    restart: unless-stopped
    profiles: ["meeting-bot"]
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      VEXA_API_URL: http://vexa-api:18056
    depends_on:
      docker-socket-proxy:
        condition: service_started
      vexa-api:
        condition: service_healthy
    networks:
      - workforce0

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: workforce0-docker-socket-proxy
    restart: unless-stopped
    profiles: ["meeting-bot"]
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - workforce0

  # vexa-transcription is part of the meeting-bot profile too, but it
  # depends on the `whisper` service from Plan 2 (local-stt profile).
  # Plan 2 adds the `whisper` service. For Plan 1 we deliberately do
  # NOT add vexa-transcription — it would crash without whisper.

  # ---------------------------------------------------------------------------
  # Ollama (local LLM, opt-in via COMPOSE_PROFILES=local-llm)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.6
    container_name: workforce0-ollama
    restart: unless-stopped
    profiles: ["local-llm"]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama_cache:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - workforce0

  # ---------------------------------------------------------------------------
  # Whisper STT (faster-whisper-server, opt-in via COMPOSE_PROFILES=local-stt)
  # ---------------------------------------------------------------------------
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: workforce0-whisper
    restart: unless-stopped
    profiles: ["local-stt"]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-large-v3-turbo}
      WHISPER_INFERENCE_DEVICE: ${WHISPER_INFERENCE_DEVICE:-auto}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      PRELOAD_MODELS: '["${WHISPER_MODEL:-Systran/faster-whisper-large-v3-turbo}"]'
    volumes:
      - whisper_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - workforce0

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  ollama_cache:
    driver: local
  whisper_cache:
    driver: local

networks:
  workforce0:
    driver: bridge
